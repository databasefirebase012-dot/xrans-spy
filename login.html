<!doctype html>
<html lang="en" data-t="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070709">
<title>NEBULA · ACCESS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>

<div class="login-shell">
  <div class="login-card">
    <div class="login-brand">
      <div class="mark big"><span>N</span><i></i></div>
      <div class="brand">NEBULA <b>CONTROL</b></div>
      <div class="sub">SECURE ACCESS</div>
    </div>

    <label class="field">
      <span>USERNAME</span>
      <input id="username" type="text" autocomplete="username" autofocus autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="ENTER USERNAME">
    </label>

    <label class="field">
      <span>PASSWORD</span>
      <input id="password" type="password" autocomplete="current-password" placeholder="ENTER PASSWORD">
    </label>

    <button id="loginBtn" class="bt g">
      <span>SIGN IN</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>

    <div id="loginErr" class="err hidden"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

$('loginBtn').onclick = async () => {
  const username = $('username').value.trim();
  const password = $('password').value;
  const err = $('loginErr');
  err.classList.add('hidden');

  if (!username || !password) {
    err.textContent = 'FIELDS REQUIRED';
    err.classList.remove('hidden');
    return;
  }

  $('loginBtn').disabled = true;
  const btnSpan = $('loginBtn').querySelector('span');
  const orig = btnSpan.textContent;
  btnSpan.textContent = 'AUTHENTICATING';

  try {
    const r = await fetch('/x/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    if (!r.ok) {
      err.textContent = 'INVALID CREDENTIALS';
      err.classList.remove('hidden');
    } else {
      location.href = '/';
    }
  } catch {
    err.textContent = 'NETWORK ERROR';
    err.classList.remove('hidden');
  } finally {
    $('loginBtn').disabled = false;
    btnSpan.textContent = orig;
  }
};

$('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') $('loginBtn').click();
});
</script>

<script type="module" src="/3d.js"></script>
</body>
</html>
